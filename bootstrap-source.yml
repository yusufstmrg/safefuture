name: Bootstrap Safe Future source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find production ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'SafeFuture_v101_1_GITHUB_UPLOAD_UNDER_25MB.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No bootstrap ZIP found; nothing to extract."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract production source to repository root
        if: steps.find_zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.find_zip.outputs.zip }}"
          unzip -q -o "$ZIP" -d .
          rm -f "$ZIP"
          find . -maxdepth 1 -type f -name 'FINAL_*.json' -delete || true
          git status --short

      - name: Commit extracted website source
        if: steps.find_zip.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Bootstrap Safe Future production source from v101.1 package'
          git push origin HEAD:main
