name: One-time Cloudflare Auth Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: make auth redirect host-agnostic') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove Vercel-bound auth redirect
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/inline-12.js')
          s = p.read_text(encoding='utf-8')
          old = "redirectTo:'https://safefuture.vercel.app/'"
          new = "redirectTo:(window.location.origin + '/')"
          if old not in s:
              raise SystemExit('Expected Vercel-bound auth redirect was not found.')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print('Auth redirect changed to current site origin.')
          PY

      - name: Remove one-time workflow and commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-cloudflare-auth-fix.yml
          git config user.name 'Safe Future Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/inline-12.js .github/workflows/one-time-cloudflare-auth-fix.yml
          git commit -m 'fix: make auth redirect host-agnostic'
          git push origin HEAD:main
