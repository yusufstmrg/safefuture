name: Safe Future one-time layout repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[sf-layout-bust]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production index references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('20260830-qa5','20260902-layout')
          marker='    <link rel="stylesheet" href="./css/production-layout-stabilizer.css?v=20260902-layout">'
          if marker not in s:
              s=s.replace('</head>', marker+'\n</head>', 1)
          marker2='    <link rel="stylesheet" href="./css/mobile-layout-hotfix.css?v=20260902-layout">'
          if marker2 not in s:
              s=s.replace('</head>', marker2+'\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'Safe Future Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: force production layout assets [sf-layout-bust] [skip ci]'
          git push
