name: Wire Final Dashboard Layer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, 'ci: wire final dashboard history layer into production page') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure final layer is loaded
        shell: bash
        run: |
          set -euo pipefail
          marker='id="sf-final-platform-fixes"'
          if grep -q "$marker" index.html; then
            echo 'Final layer already wired.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='\n<script id="sf-final-platform-fixes" src="./js/final-platform-fixes.js?v=20260827-2" defer></script>\n'
          if '</body>' not in s:
              raise SystemExit('index.html has no </body> marker')
          s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No wiring change needed.'
            exit 0
          fi
          git config user.name 'Safe Future CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'ci: wire final dashboard history layer into production page'
          git push