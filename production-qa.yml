name: Safe Future Production QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count+1))
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
          echo "Checked $count JavaScript files."

      - name: Local asset references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('.')
          html = root / 'index.html'
          text = html.read_text(encoding='utf-8', errors='ignore')
          refs = re.findall(r'''(?:src|href)=[\"']([^\"']+)[\"']''', text, re.I)
          external = ('http://','https://','data:','mailto:','tel:','#','javascript:')
          optional = {'./favicon.ico'}
          missing=[]
          for ref in refs:
              if ref.startswith(external) or ref in optional:
                  continue
              clean=ref.split('?',1)[0].split('#',1)[0]
              if not clean or clean.startswith('/'):
                  continue
              p=(root/clean.lstrip('./')).resolve()
              if not p.exists():
                  missing.append(ref)
          if missing:
              print('Missing local references:')
              print('\n'.join(sorted(set(missing))))
              sys.exit(1)
          print(f'Checked {len(refs)} HTML asset references.')
          PY

      - name: Production-domain hygiene
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude='*.map' 'safefuture.geminilaunch.com' index.html js css assets images *.html 2>/dev/null; then
            echo 'Legacy production domain reference found in application source.'
            exit 1
          fi
          echo 'Legacy GeminiLaunch production-domain references in application source: 0'

      - name: Critical runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f js/final-platform-fixes.js
          test -f js/history-authority.js
          test -f js/phase3-workspace.js
          test -f js/phase4-business-platform.js
          grep -q 'window.supabaseClient' js/inline-02.js
          grep -q 'setInterval' js/inline-02.js
          grep -q 'history-authority.js' js/inline-02.js
          grep -q 'final-platform-fixes.js' js/inline-02.js
          grep -q 'get_my_assessment_history' js/phase3-workspace.js
          grep -q 'sfProductionViewAssessment' js/final-platform-fixes.js
          grep -q 'sfProductionDownloadReport' js/final-platform-fixes.js
          grep -q 'sfHistoryAuthorityRefresh' js/history-authority.js
          echo 'Critical history/report/auth wiring present.'

      - name: Script-order guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = (Path('index.html')).read_text(encoding='utf-8', errors='ignore')
          p2=text.find('./js/inline-02.js')
          p3=text.find('./js/inline-03.js')
          if p2 < 0 or p3 < 0 or p2 >= p3:
              raise SystemExit('Expected inline-02.js to load before inline-03.js.')
          print('inline-02.js -> inline-03.js ordering: PASS')
          PY

      - name: Critical modules exist
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f js/final-platform-fixes.js
          test -f js/history-authority.js
          test -f js/phase3-workspace.js
          test -f js/phase4-business-platform.js
          test -f js/phase5-crm.js
          test -f js/wpr-persistence-hardening.js
          test -f js/production-hardening.js
          echo 'Critical production modules present.'
